default:
  image: docker:25.0.3-dind
  before_script:
    - dockerd -l fatal &
    - sleep 5
  tags:
    - amd64-runner

variables:
  KUBERNETES_CPU_REQUEST: 60
  KUBERNETES_MEMORY_REQUEST: 256G
  KUBERNETES_EPHEMERAL_STORAGE_REQUEST: 500G

build:
  stage: build

  before_script:
    - apk add --update curl && apk add --update git unzip zip && rm -rf /var/cache/apk/*
    - dockerd -l fatal &
    # - docker login -u "$ART_DOCKER_USER" -p "$ART_DOCKER_PASS" $ART_DOCKER_REG
    # Installing JFrog CLI
    - curl -fL https://install-cli.jfrog.io | sh
    - chmod +x /usr/local/bin/jf
    # Configure Artifactory instance with JFrog CLI
    - pwd
    - projFolder=$(pwd)
    # - cd /usr/local/bin/
    - /usr/local/bin/jf --version
    - /usr/local/bin/jf c add artifactory-server --url=$ART_PLAT_URL --user=$ART_PLAT_USER --password=$ART_PLAT_PASS
    - /usr/local/bin/jf rt ping


  script:
    # Variables
    - QCOM_RELEASE=qcom-6.6.119-QLI.1.8-Ver.1.1_robotics-sdk-1.1
    - DOCKER_TAG="qcom-6.6.119-qli.1.8-ver.1.1_robotics-sdk-1.1_c1_20.04"
    - URL="https://github.com/qualcomm-linux/qcom-manifest"
    - BRANCH="qcom-linux-scarthgap"
    - MANIFEST_FILE="${QCOM_RELEASE}.xml"
    - MACHINE="qcs9075-iq-9075-evk"
    - ARCH="x86"
    - DISTRO="qcom-robotics-ros2-jazzy"
    - IMAGE="qcom-robotics-full-image"
    - USER=lnxbuild
    - UID=2366345
    - GID=2366345
    - WORK_DIR="/home/${USER}/app"

    # Docker Build & Run
    - docker build --build-arg USER=${USER} --build-arg UID=${UID} --build-arg GID=${GID} --no-cache -t ${DOCKER_TAG} .
    - docker run --name build ${DOCKER_TAG} -u ${URL} -b ${BRANCH} -m ${MANIFEST_FILE} -M ${MACHINE} -d ${DISTRO} -i ${IMAGE} -w "${WORK_DIR}/${DOCKER_TAG}" -a ${ARCH}
    - mkdir -p /target/qcs9075-iq-9075-evk/qcom-robotics-full-image
    - mkdir -p /target/qcs9075-iq-9075-evk/sdk
    - mkdir -p /target/qcs9075-iq-9075-evk/qirpsdk_artifacts
    - docker cp build:${WORK_DIR}/qcom-6.6.119-qli.1.8-ver.1.1_robotics-sdk-1.1_c1_20.04/build-qcom-robotics-ros2-jazzy/tmp-glibc/deploy/images/qcs9075-iq-9075-evk/qcom-robotics-full-image/. /target/qcs9075-iq-9075-evk/qcom-robotics-full-image/
    - docker cp build:${WORK_DIR}/qcom-6.6.119-qli.1.8-ver.1.1_robotics-sdk-1.1_c1_20.04/build-qcom-robotics-ros2-jazzy/tmp-glibc/deploy/sdk/. /target/qcs9075-iq-9075-evk/sdk/
    - docker cp build:${WORK_DIR}/qcom-6.6.119-qli.1.8-ver.1.1_robotics-sdk-1.1_c1_20.04/build-qcom-robotics-ros2-jazzy/tmp-glibc/deploy/qirpsdk_artifacts/. /target/qcs9075-iq-9075-evk/qirpsdk_artifacts/
    - docker cp build:${WORK_DIR}/qcom-6.6.119-qli.1.8-ver.1.1_robotics-sdk-1.1_c1_20.04/NOTICE /target/qcs9075-iq-9075-evk/
    - docker cp build:${WORK_DIR}/qcom-6.6.119-qli.1.8-ver.1.1_robotics-sdk-1.1_c1_20.04/NO.LOGIN.BINARY.LICENSE.QTI.pdf /target/qcs9075-iq-9075-evk/
    # - zip -r x86-qcom-6.6.119-qli.1.8-ver.1.1_robotics-sdk-1.1.zip /target/qcs9075-iq-9075-evk
    - zip -r x86-qcom-6.6.119-QLI.1.8-Ver.1.1_robotics-sdk-image-1.1.zip /target/qcs9075-iq-9075-evk/qcom-robotics-full-image /target/qcs9075-iq-9075-evk/NOTICE /target/qcs9075-iq-9075-evk/NO.LOGIN.BINARY.LICENSE.QTI.pdf
    - zip -r x86-qcom-6.6.119-QLI.1.8-Ver.1.1_robotics-sdk-artifacts-1.1.zip /target/qcs9075-iq-9075-evk/qirpsdk_artifacts /target/qcs9075-iq-9075-evk/NOTICE /target/qcs9075-iq-9075-evk/NO.LOGIN.BINARY.LICENSE.QTI.pdf
    - zip -r x86-qcom-6.6.119-QLI.1.8-Ver.1.1_robotics-sdk-esdk-1.1.zip /target/qcs9075-iq-9075-evk /target/qcs9075-iq-9075-evk/sdk -i /target/qcs9075-iq-9075-evk/sdk/*-toolchain-ext-*.sh -i /target/qcs9075-iq-9075-evk/NOTICE -i /target/qcs9075-iq-9075-evk/NO.LOGIN.BINARY.LICENSE.QTI.pdf
    - zip -r x86-qcom-6.6.119-QLI.1.8-Ver.1.1_robotics-sdk-standardsdk-1.1.zip /target/qcs9075-iq-9075-evk /target/qcs9075-iq-9075-evk/sdk -i /target/qcs9075-iq-9075-evk/sdk/*-toolchain-*.sh -x /target/qcs9075-iq-9075-evk/sdk/*-toolchain-ext-*.sh -i /target/qcs9075-iq-9075-evk/NOTICE -i /target/qcs9075-iq-9075-evk/NO.LOGIN.BINARY.LICENSE.QTI.pdf
    - docker rm build
    - /usr/local/bin/jf rt ping
    - /usr/local/bin/jf rt u --detailed-summary --flat=false --recursive "x86-qcom-6.6.119-QLI.1.8-Ver.1.1_robotics-sdk*-1.1.zip" qli-ci/flashable-binaries/qirpsdk/qcs9075-iq-9075-evk/