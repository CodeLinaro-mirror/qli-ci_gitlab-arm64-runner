default:
  image: docker:25.0.3-dind
  before_script:
    - dockerd -l fatal &
    - sleep 5
  tags:
    - arm64-runner

variables:
  KUBERNETES_CPU_REQUEST: 60
  KUBERNETES_MEMORY_REQUEST: 256G
  KUBERNETES_EPHEMERAL_STORAGE_REQUEST: 500G

build:
  stage: build

  before_script:
    - apk add --update curl && apk add --update git unzip zip && rm -rf /var/cache/apk/*
    - dockerd -l fatal &
    # - docker login -u "$ART_DOCKER_USER" -p "$ART_DOCKER_PASS" $ART_DOCKER_REG
    # Installing JFrog CLI
    - curl -fL https://install-cli.jfrog.io | sh
    - chmod +x /usr/local/bin/jf
    # Configure Artifactory instance with JFrog CLI
    - pwd
    - projFolder=$(pwd)
    # - cd /usr/local/bin/
    - /usr/local/bin/jf --version
    - /usr/local/bin/jf c add artifactory-server --url=$ART_PLAT_URL --user=$ART_PLAT_USER --password=$ART_PLAT_PASS
    - /usr/local/bin/jf rt ping


  script:
    # Variables
    - QCOM_RELEASE=qcom-6.6.119-QLI.1.8-Ver.1.1_qim-product-sdk-2.3.1
    - DOCKER_TAG="qcom-6.6.119-qli.1.8-ver.1.1_qim-product-sdk-comb-zip-2.3.1_20.04"
    - URL="https://github.com/qualcomm-linux/qcom-manifest"
    - BRANCH="qcom-linux-scarthgap"
    - MANIFEST_FILE="${QCOM_RELEASE}.xml"
    - MACHINE="qcs9075-iq-9075-evk"
    - ARCH="arm"
    - DISTRO="qcom-wayland"
    - IMAGE="qcom-multimedia-image"
    - USER=lnxbuild
    - UID=2366345
    - GID=2366345
    - WORK_DIR="/home/${USER}/app"

    # Docker Build & Run
    - docker build --build-arg USER=${USER} --build-arg UID=${UID} --build-arg GID=${GID} --no-cache -t ${DOCKER_TAG} .
    - wget https://artifacts.codelinaro.org/artifactory/qli-ci/flashable-binaries/qimpsdk/qcs9075-iq-9075-evk/arm-qcom-6.6.119-QLI.1.8-Ver.1.1_qim-product-sdk-image-2.3.1.zip
    - unzip arm-qcom-6.6.119-QLI.1.8-Ver.1.1_qim-product-sdk-image-2.3.1.zip
    - rm -rf arm-qcom-6.6.119-QLI.1.8-Ver.1.1_qim-product-sdk-image-2.3.1.zip
    - wget https://artifacts.codelinaro.org/artifactory/qli-ci/flashable-binaries/qimpsdk/qcs9075-iq-9075-evk/arm-qcom-6.6.119-QLI.1.8-Ver.1.1_qim-product-sdk-artifacts-2.3.1.zip
    - unzip -o arm-qcom-6.6.119-QLI.1.8-Ver.1.1_qim-product-sdk-artifacts-2.3.1.zip
    - rm -rf arm-qcom-6.6.119-QLI.1.8-Ver.1.1_qim-product-sdk-artifacts-2.3.1.zip
    - wget https://artifacts.codelinaro.org/artifactory/qli-ci/flashable-binaries/qimpsdk/qcs9075-iq-9075-evk/arm-qcom-6.6.119-QLI.1.8-Ver.1.1_qim-product-sdk-esdk-2.3.1.zip
    - unzip -o arm-qcom-6.6.119-QLI.1.8-Ver.1.1_qim-product-sdk-esdk-2.3.1.zip
    - rm -rf arm-qcom-6.6.119-QLI.1.8-Ver.1.1_qim-product-sdk-esdk-2.3.1.zip
    - wget https://artifacts.codelinaro.org/artifactory/qli-ci/flashable-binaries/qimpsdk/qcs9075-iq-9075-evk/arm-qcom-6.6.119-QLI.1.8-Ver.1.1_qim-product-sdk-standardsdk-2.3.1.zip
    - unzip -o arm-qcom-6.6.119-QLI.1.8-Ver.1.1_qim-product-sdk-standardsdk-2.3.1.zip
    - rm -rf arm-qcom-6.6.119-QLI.1.8-Ver.1.1_qim-product-sdk-standardsdk-2.3.1.zip
    - tree target
    #- docker rm build
    - zip -r arm-qcom-6.6.119-QLI.1.8-Ver.1.1_qim-product-sdk-2.3.1.zip target/qcs9075-iq-9075-evk
    - /usr/local/bin/jf rt ping
    - /usr/local/bin/jf rt u --detailed-summary --flat=false --recursive arm-qcom-6.6.119-QLI.1.8-Ver.1.1_qim-product-sdk-2.3.1.zip qli-ci/flashable-binaries/qimpsdk/qcs9075-iq-9075-evk/