default:
  image: docker:25.0.3-dind
  before_script:
    - dockerd -l fatal &
    - sleep 5
  tags:
    - arm64-runner

variables:
  KUBERNETES_CPU_REQUEST: 60
  KUBERNETES_MEMORY_REQUEST: 256G
  KUBERNETES_EPHEMERAL_STORAGE_REQUEST: 500G

build:
  stage: build

  before_script:
    - apk add --update curl && apk add --update git unzip zip && rm -rf /var/cache/apk/*
    - dockerd -l fatal &
    # - docker login -u "$ART_DOCKER_USER" -p "$ART_DOCKER_PASS" $ART_DOCKER_REG
    # Installing JFrog CLI
    - curl -fL https://install-cli.jfrog.io | sh
    - chmod +x /usr/local/bin/jf
    # Configure Artifactory instance with JFrog CLI
    - pwd
    - projFolder=$(pwd)
    # - cd /usr/local/bin/
    - /usr/local/bin/jf --version
    - /usr/local/bin/jf c add artifactory-server --url=$ART_PLAT_URL --user=$ART_PLAT_USER --password=$ART_PLAT_PASS
    - /usr/local/bin/jf rt ping


  script:
    # Variables
    - QCOM_RELEASE=qcom-6.6.97-QLI.1.6-Ver.1.1_qim-product-sdk-2.1.1
    - DOCKER_TAG="qcom-6.6.97-qli.1.6-ver.1.1_qim-product-sdk-2.1.1_20.04"
    - URL="https://github.com/qualcomm-linux/qcom-manifest"
    - BRANCH="qcom-linux-scarthgap"
    - MANIFEST_FILE="${QCOM_RELEASE}.xml"
    - MACHINE="qcs6490-rb3gen2-vision-kit"
    - ARCH="arm"
    - DISTRO="qcom-wayland"
    - IMAGE="qcom-multimedia-image"
    - USER=lnxbuild
    - UID=2366345
    - GID=2366345
    - WORK_DIR="/home/${USER}/app"

    # Docker Build & Run
    - docker build --build-arg USER=${USER} --build-arg UID=${UID} --build-arg GID=${GID} --no-cache -t ${DOCKER_TAG} .
    - docker run --name build ${DOCKER_TAG} -u ${URL} -b ${BRANCH} -m ${MANIFEST_FILE} -M ${MACHINE} -d ${DISTRO} -i ${IMAGE} -w "${WORK_DIR}/${DOCKER_TAG}" -a ${ARCH}
    - mkdir -p /target/qcs6490-rb3gen2-vision-kit/qcom-multimedia-image
    - mkdir -p /target/qcs6490-rb3gen2-vision-kit/sdk
    - mkdir -p /target/qcs6490-rb3gen2-vision-kit/qim_prod_sdk_artifacts
    - docker cp build:${WORK_DIR}/qcom-6.6.97-qli.1.6-ver.1.1_qim-product-sdk-2.1.1_20.04/build-qcom-wayland/tmp-glibc/deploy/images/qcs6490-rb3gen2-vision-kit/qcom-multimedia-image/. /target/qcs6490-rb3gen2-vision-kit/qcom-multimedia-image/
    - docker cp build:${WORK_DIR}/qcom-6.6.97-qli.1.6-ver.1.1_qim-product-sdk-2.1.1_20.04/build-qcom-wayland/tmp-glibc/deploy/sdk/. /target/qcs6490-rb3gen2-vision-kit/sdk/
    - docker cp build:${WORK_DIR}/qcom-6.6.97-qli.1.6-ver.1.1_qim-product-sdk-2.1.1_20.04/build-qcom-wayland/tmp-glibc/deploy/qim_prod_sdk_artifacts/. /target/qcs6490-rb3gen2-vision-kit/qim_prod_sdk_artifacts/
    - docker cp build:${WORK_DIR}/qcom-6.6.97-qli.1.6-ver.1.1_qim-product-sdk-2.1.1_20.04/NOTICE /target/qcs6490-rb3gen2-vision-kit/
    - docker cp build:${WORK_DIR}/qcom-6.6.97-qli.1.6-ver.1.1_qim-product-sdk-2.1.1_20.04/NO.LOGIN.BINARY.LICENSE.QTI.pdf /target/qcs6490-rb3gen2-vision-kit/
    # - zip -r arm-qcom-6.6.97-QLI.1.6-Ver.1.1_qim-product-sdk-2.1.1.zip /target/qcs6490-rb3gen2-vision-kit
    - zip -r arm-qcom-6.6.97-QLI.1.6-Ver.1.1_qim-product-sdk-image-2.1.1.zip /target/qcs6490-rb3gen2-vision-kit/qcom-multimedia-image /target/qcs6490-rb3gen2-vision-kit/NOTICE /target/qcs6490-rb3gen2-vision-kit/NO.LOGIN.BINARY.LICENSE.QTI.pdf
    - zip -r arm-qcom-6.6.97-QLI.1.6-Ver.1.1_qim-product-sdk-artifacts-2.1.1.zip /target/qcs6490-rb3gen2-vision-kit/qim_prod_sdk_artifacts /target/qcs6490-rb3gen2-vision-kit/NOTICE /target/qcs6490-rb3gen2-vision-kit/NO.LOGIN.BINARY.LICENSE.QTI.pdf
    - zip -r arm-qcom-6.6.97-QLI.1.6-Ver.1.1_qim-product-sdk-esdk-2.1.1.zip /target/qcs6490-rb3gen2-vision-kit /target/qcs6490-rb3gen2-vision-kit/sdk -i /target/qcs6490-rb3gen2-vision-kit/sdk/*-toolchain-ext-*.sh -i /target/qcs6490-rb3gen2-vision-kit/NOTICE -i /target/qcs6490-rb3gen2-vision-kit/NO.LOGIN.BINARY.LICENSE.QTI.pdf
    - zip -r arm-qcom-6.6.97-QLI.1.6-Ver.1.1_qim-product-sdk-standardsdk-2.1.1.zip /target/qcs6490-rb3gen2-vision-kit /target/qcs6490-rb3gen2-vision-kit/sdk -i /target/qcs6490-rb3gen2-vision-kit/sdk/*-toolchain-*.sh -x /target/qcs6490-rb3gen2-vision-kit/sdk/*-toolchain-ext-*.sh -i /target/qcs6490-rb3gen2-vision-kit/NOTICE -i /target/qcs6490-rb3gen2-vision-kit/NO.LOGIN.BINARY.LICENSE.QTI.pdf
    - docker rm build
    - /usr/local/bin/jf rt ping
    - /usr/local/bin/jf rt u --detailed-summary --flat=false --recursive "arm-qcom-6.6.97-QLI.1.6-Ver.1.1_qim-product-sdk*-2.1.1.zip" qli-ci/flashable-binaries/qimpsdk/qcs6490-rb3gen2-vision-kit/